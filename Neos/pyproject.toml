[project]
name = "neos"
version = "0.1.0"
description = "Neos multimodal search, evidence interfaces, and agentic training"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "alibabacloud-oss-v2>=1.3.2",
    "Pillow>=9",
    "requests>=2.28",
    "openai>=2,<3",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "jsonschema>=4",
    "json-repair>=0.61,<1",
    "PyYAML>=6",
    "psutil>=7",
]

[project.optional-dependencies]
train = ["pandas>=2", "pyarrow>=17", "datasets>=4", "hydra-core>=1.3", "omegaconf>=2.3", "safetensors>=0.6"]
test = ["pytest>=8", "numpy>=1.26", "torch>=2.9"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neos*"]

[tool.pytest.ini_options]
                                                                          
                                                                        
                                                                 
testpaths = ["tests"]
