                                 
              
                                 
[build-system]
requires = [
    "setuptools>=61.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

                                 
                            
                                 
[project]
name = "verl"
                                                                                             
                                          
                                                                                 
dynamic = ["version", "dependencies", "optional-dependencies", "authors", "urls"]

description = "verl: Volcano Engine Reinforcement Learning for LLM"
license = {text = "Apache-2.0"}                                    
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"

                                 
                                   
                                 
[tool.ruff]
                                                                                                      
                                                                              
line-length = 120
exclude = ["scripts/legacy_model_merger.py"]

[tool.ruff.lint]
isort = {known-first-party = ["verl"]}
                                                                                                        
select = [
                 
    "E",
              
    "F",
               
    "UP",
                    
    "B",
           
    "I",
    "G",
]
ignore = [
                  
    "F405", "F403",
                                  
    "E731",
                                                     
    "B007",
                     
    "UP032",
                                      
    "G004",
                                   
    "UP045",
                       
    "UP035",
]

                                 
                                 
                                 
[tool.mypy]
pretty            = true
ignore_missing_imports = true
explicit_package_bases = true
follow_imports = "skip"

                 
ignore_errors = true

[[tool.mypy.overrides]]
module = [
"verl.trainer.config.algorithm",
"verl.trainer.ppo.core_algos",
"verl.trainer.ppo.reward",
"verl.workers.reward_manager",
"verl.workers.reward_manager.*",
]
ignore_errors = false

                                 
                                     
                                 
[tool.setuptools]
                                                                                                   
                                                              
include-package-data = true

                                                           
[tool.setuptools.dynamic]
version = {file = "verl/version/version"}

                                               
[tool.setuptools.package-dir]
"" = "."

                                                                                    
                                                                                                     
[tool.setuptools.package-data]
verl = [
  "version/*",
  "trainer/config/*.yaml",
  "trainer/config/*/*.yaml",
  "experimental/*/config/*.yaml",
]
