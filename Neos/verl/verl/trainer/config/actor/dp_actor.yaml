                               
                                           
                                                   
                                                                      
                                                      

                                                         
defaults:

                         
  - ../optim@optim: fsdp

                      
  - ../engine@fsdp_config: fsdp

                                                                    
  - actor

                                                                                
  - _self_

                                     
_target_: verl.workers.config.FSDPActorConfig

                                   
strategy: fsdp

                                                                
grad_clip: 1.0

                                                               
                                                                   
                                                                     
ulysses_sequence_parallel_size: 1

                                                       
entropy_from_logits_with_chunking: False

                                                  
entropy_from_logits_chunk_size: 2048

                   
entropy_checkpointing: False

             
fsdp_config:

                                              
  entropy_from_logits_with_chunking: ${oc.select:actor_rollout_ref.actor.entropy_from_logits_with_chunking,False}

                                                  
  entropy_from_logits_chunk_size: ${oc.select:actor_rollout_ref.actor.entropy_from_logits_chunk_size,2048}

                                
  entropy_checkpointing: ${oc.select:actor_rollout_ref.actor.entropy_checkpointing,False}

                                                            
use_remove_padding: ${oc.select:actor_rollout_ref.model.use_remove_padding,false}

