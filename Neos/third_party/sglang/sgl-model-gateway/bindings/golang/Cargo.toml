[package]
name = "sgl-model-gateway-golang"
version = "0.3.2"
edition = "2021"

[lib]
name = "sgl_model_gateway_go"
crate-type = ["cdylib"]

[dependencies]
tokio = { version = "1.42.0", features = ["full"] }
serde_json = { version = "1.0", default-features = false, features = [
    "std",
    "preserve_order",
] }
uuid = { version = "1.10", features = ["v4", "serde"] }
once_cell = "1.21.3"
futures-util = "0.3"
tracing = "0.1"
libc = "0.2.179"

[dependencies.sgl-model-gateway]
path = "../.."
default-features = true

[features]
default = []
vendored-openssl = ["sgl-model-gateway/vendored-openssl"]

[profile.release]
opt-level = "z"                        
lto = "fat"                                        
codegen-units = 1                                        
strip = true                             

[profile.ci]
inherits = "release"
opt-level = 2                                                                       
lto = "thin"                                 
codegen-units = 16                                          
strip = true

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256
